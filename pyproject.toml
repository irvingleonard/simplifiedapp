[build-system]
requires = ['pip', 'setuptools', 'wheel', 'tomli', 'introspection']
build-backend = 'setuptools.build_meta:__legacy__'

[project]
name = 'simplifiedapp'
dynamic = ['version', 'description', 'readme']
requires-python = '>=3.9'
authors = [
	{ name = 'Irving Leonard', email = 'irvingleonard@gmail.com'}
]
keywords = ['cli', 'main', 'setuptools']
license = {text = 'BSD 3-Clause "New" or "Revised" License'}
classifiers = [
	'Development Status :: 4 - Beta',
	'Environment :: Console',
	'Intended Audience :: Developers',
	'Intended Audience :: End Users/Desktop',
	'License :: OSI Approved :: BSD License',
	'Natural Language :: English',
	'Operating System :: OS Independent',
	'Programming Language :: Python',
    'Programming Language :: Python :: 3',
	'Programming Language :: Python :: 3 :: Only',
	'Topic :: Software Development :: Libraries',
	'Topic :: Software Development :: Libraries :: Python Modules',
]
dependencies = [
	'introspection !=1.9.5, !=1.9.6, !=1.9.7, !=1.9.8, !=1.9.9, !=1.9.10, !=1.9.11, !=1.10.0, !=1.10.1',
]

[project.optional-dependencies]
dev = [
	'coverage',
]
full = [
    'docstring_parser',
]

[project.urls]
homepage = 'https://github.com/irvingleonard/simplifiedapp'
# documentation = 'https://github.com/irvingleonard/simplifiedapp'
repository = 'https://github.com/irvingleonard/simplifiedapp.git'

[tool.setuptools.packages.find]
include = ['simplifiedapp*']